<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SoundCloud</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Консоль ошибок -->
    <div id="errorConsole" style="display: none; position: fixed; top: 0; left: 0; right: 0; background: rgba(255, 0, 0, 0.9); color: white; padding: 15px; z-index: 9999; font-family: monospace; font-size: 12px; word-wrap: break-word;">
        <strong>ОШИБКА:</strong> <span id="errorText"></span>
        <button onclick="document.getElementById('errorConsole').style.display='none'" style="float: right; background: white; color: red; border: none; border-radius: 5px; padding: 2px 5px;">X</button>
    </div>

    <!-- Фоновые свечения -->
    <div class="glow-top"></div>
    <div class="glow-bottom"></div>

    <!-- Шапка -->
    <header class="header">
        <div class="header-title">
            <span class="subtitle">ПОИСК · ЛИНЗА</span>
            <h1>Что слушаем<br>сегодня?</h1>
        </div>
    </header>

    <!-- Поиск -->
    <div class="search-container">
        <div class="search-box">
            <span class="search-icon">🔍</span>
            <input type="text" id="searchInput" placeholder="Треки, артисты...">
        </div>
    </div>

    <!-- Список треков -->
    <div id="trackList" class="track-list"></div>

    <!-- МИНИ-ПЛЕЕР -->
    <div id="miniPlayer" class="mini-player hidden">
        <div class="mini-artwork-container">
            <img id="miniArtwork" class="mini-artwork" src="" onerror="this.src='https://via.placeholder.com/50/282828/FFFFFF?text=🎵'">
            <!-- Оверлей загрузки -->
            <div id="loadingOverlay" class="loading-overlay">
                <span id="loadingPercent">0%</span>
            </div>
        </div>
        <div class="mini-info">
            <div id="miniTitle" class="mini-title">Название</div>
            <div id="miniArtist" class="mini-artist">Артист</div>
        </div>
        <button id="miniPlayPause" class="mini-play-btn">▶️</button>
    </div>

    <!-- РАЗВЕРНУТЫЙ ПЛЕЕР (Полный экран) -->
    <div id="fullPlayer" class="full-player">
        <!-- Фон (размытая обложка) -->
        <div id="playerBg" class="player-bg"></div>
        
        <div class="full-player-content">
            <!-- Шапка плеера -->
            <div class="full-player-header">
                <button id="closePlayer" class="icon-btn">⌄</button>
                <div class="header-text">
                    <span class="subtitle">СЕЙЧАС ИГРАЕТ</span>
                    <span class="queue-text">Очередь</span>
                </div>
                <button class="icon-btn">⋮</button>
            </div>

            <!-- Обложка -->
            <div class="full-artwork-container">
                <img id="fullArtwork" class="full-artwork" src="">
            </div>

            <!-- Инфо о треке -->
            <div class="track-info-full">
                <div class="text-container">
                    <h1 id="fullTitle" class="full-title">Название</h1>
                    <h2 id="fullArtist" class="full-artist">Артист</h2>
                </div>
                <button class="like-btn">❤</button>
            </div>

            <!-- Время и ползунок -->
            <div class="progress-container">
                <div class="time-labels">
                    <span id="currentTime">0:00</span>
                    <span id="totalTime">-0:00</span>
                </div>
                <input type="range" id="seekBar" class="seek-bar" value="0" min="0" max="100" step="0.1">
            </div>

            <!-- Управление -->
            <div class="controls">
                <button class="control-btn small">🔀</button>
                <button class="control-btn">⏮</button>
                <button id="fullPlayPause" class="control-btn play-btn-full">⏸</button>
                <button class="control-btn">⏭</button>
                <button class="control-btn small">🔁</button>
            </div>
            
            <!-- Нижняя панель (заглушка) -->
            <div class="bottom-panel">
                <span>Текст</span>
                <span>Радио</span>
                <span>Эквалайзер</span>
                <span>Не то</span>
            </div>
        </div>
    </div>

    <!-- Нижнее меню -->
    <nav class="bottom-nav">
        <div class="nav-item"><span class="nav-icon">🌊</span><span class="nav-text">Волна</span></div>
        <div class="nav-item active"><span class="nav-icon">🔍</span><span class="nav-text">Поиск</span></div>
        <div class="nav-item"><span class="nav-icon">👤</span><span class="nav-text">Я</span></div>
    </nav>

    <audio id="audioPlayer"></audio>
    <script src="script.js"></script>
</body>
</html>
