<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SoundCloud Client</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Шапка -->
    <div class="header">
        <input type="text" id="searchInput" placeholder="Поиск (например: Daft Punk)">
        <button id="searchBtn">Найти</button>
    </div>

    <!-- Список треков -->
    <div id="trackList" class="track-list">
        <!-- Сюда будут загружаться треки -->
    </div>

    <!-- Мини-плеер -->
    <div id="player" class="player hidden">
        <img id="playerArtwork" class="player-artwork" src="" alt="Artwork">
        <div class="player-info">
            <div id="playerTitle" class="player-title">Название трека</div>
            <div id="playerArtist" class="player-artist">Исполнитель</div>
        </div>
        <button id="playPauseBtn" class="play-btn">▶️</button>
    </div>

    <!-- Скрытый аудио-тег -->
    <audio id="audioPlayer"></audio>

    <script src="script.js"></script>
</body>
</html>
