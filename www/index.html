<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SoundCloud</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- ЭКРАН ВХОДА -->
    <div id="loginScreen" class="full-screen-overlay">
        <div class="login-box">
            <h1 style="margin-bottom: 10px;">Добро пожаловать</h1>
            <p style="color: #999; margin-bottom: 30px; font-size: 15px;">Войдите в аккаунт SoundCloud, чтобы слушать музыку и видеть свои лайки.</p>
            <button id="loginBtn" class="btn-primary">Войти в аккаунт</button>
        </div>
    </div>

    <!-- ГЛАВНЫЙ ЭКРАН -->
    <div id="mainApp" class="hidden">
        <header class="header">
            <div class="header-title">
                <span class="subtitle" id="pageSubtitle">ПОИСК · ЛИНЗА</span>
                <h1 id="pageTitle">Что слушаем<br>сегодня?</h1>
            </div>
        </header>

        <!-- Поиск -->
        <div id="searchContainer" class="search-container">
            <div class="search-box">
                <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <input type="text" id="searchInput" placeholder="Треки, артисты...">
            </div>
        </div>

        <div id="trackList" class="track-list"></div>

        <!-- МИНИ-ПЛЕЕР -->
        <div id="miniPlayer" class="mini-player hidden">
            <div class="mini-artwork-container">
                <img id="miniArtwork" class="mini-artwork" src="" onerror="this.src='https://via.placeholder.com/50/282828/FFFFFF?text=🎵'">
                <div id="loadingOverlay" class="loading-overlay"><span id="loadingPercent">0%</span></div>
            </div>
            <div class="mini-info">
                <div id="miniTitle" class="mini-title">Название</div>
                <div id="miniArtist" class="mini-artist">Артист</div>
            </div>
            <button id="miniPlayPause" class="mini-play-btn">
                <svg id="miniPlayIcon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
            </button>
        </div>

        <!-- НИЖНЕЕ МЕНЮ (Только Поиск и Профиль) -->
        <nav class="bottom-nav">
            <div class="nav-item active" id="navSearch">
                <span class="nav-icon">🔍</span><span class="nav-text">Поиск</span>
            </div>
            <div class="nav-item" id="navProfile">
                <span class="nav-icon">👤</span><span class="nav-text">Я</span>
            </div>
        </nav>
    </div>

    <!-- РАЗВЕРНУТЫЙ ПЛЕЕР -->
    <div id="fullPlayer" class="full-player">
        <div id="playerBg" class="player-bg"></div>
        <div class="full-player-content">
            <div class="full-player-header">
                <button id="closePlayer" class="icon-btn"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg></button>
                <div class="header-text"><span class="subtitle">СЕЙЧАС ИГРАЕТ</span></div>
                <div style="width: 40px;"></div>
            </div>
            <div class="full-artwork-container"><img id="fullArtwork" class="full-artwork" src=""></div>
            <div class="track-info-full">
                <div class="text-container">
                    <h1 id="fullTitle" class="full-title">Название</h1>
                    <h2 id="fullArtist" class="full-artist">Артист</h2>
                </div>
            </div>
            <div class="progress-container">
                <div class="time-labels"><span id="currentTime">0:00</span><span id="totalTime">-0:00</span></div>
                <input type="range" id="seekBar" class="seek-bar" value="0" min="0" max="100" step="0.1">
            </div>
            <div class="controls">
                <button id="prevBtn" class="control-btn"><svg width="32" height="32" viewBox="0 0 24 24" fill="currentColor"><polygon points="19 20 9 12 19 4 19 20"></polygon><line x1="5" y1="19" x2="5" y2="5" stroke="currentColor" stroke-width="2"></line></svg></button>
                <button id="fullPlayPause" class="control-btn play-btn-full">
                    <svg id="fullPlayIcon" width="32" height="32" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                </button>
                <button id="nextBtn" class="control-btn"><svg width="32" height="32" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 4 15 12 5 20 5 4"></polygon><line x1="19" y1="5" x2="19" y2="19" stroke="currentColor" stroke-width="2"></line></svg></button>
            </div>
        </div>
    </div>

    <audio id="audioPlayer"></audio>
    <script src="script.js"></script>
</body>
</html>
