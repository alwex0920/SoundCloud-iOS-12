name: SoundCloudApp
options:
  bundleIdPrefix: com.alwex
  deploymentTarget:
    iOS: "12.0"
targets:
  SoundCloudApp:
    type: application
    platform: iOS
    sources: 
      - path: Sources
      - path: www
        type: folder # <--- Важно указать, что это папка с ресурсами
    settings:
      base:
        INFOPLIST_FILE: Sources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.alwex.soundcloud
